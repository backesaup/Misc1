# Renders sample lines in several Fish Audio voices to public/voice-samples/ so you can listen
# on the parent screen and pick one. Run it from the Actions tab ("Run workflow").
name: Voice samples

on:
  workflow_dispatch:
    inputs:
      searches:
        description: 'Voice searches, separated by | (e.g. british male narrator|cute robot)'
        default: 'british male narrator|calm storyteller|cute robot'

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fish-audio-sdk
      - name: Render samples
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          SEARCHES: ${{ inputs.searches }}
        run: |
          IFS='|' read -ra Q <<< "$SEARCHES"
          python scripts/fish-voice-samples.py "${Q[@]}"
      - name: Commit
        run: |
          git config user.name "narration-bot"
          git config user.email "narration-bot@users.noreply.github.com"
          git add public/voice-samples
          git diff --cached --quiet || (git commit -m "Voice samples" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}")
